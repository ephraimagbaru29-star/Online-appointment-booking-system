<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Appointments</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="topbar"></div>

  <main class="container">
    <h1 class="section-title mt-0">Appointments</h1>

    <div id="alert"></div>

    <div class="card">
      <div class="filters">
        <div class="field">
          <label for="fDate">Date</label>
          <input id="fDate" type="date" />
        </div>
        <div class="field">
          <label for="fService">Service</label>
          <select id="fService"><option value="">All services</option></select>
        </div>
        <div class="field">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <button class="btn" id="applyBtn">Apply</button>
        <button class="btn ghost" id="clearBtn">Clear</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Reference</th><th>Customer</th><th>Service</th>
              <th>Date &amp; time</th><th>Status</th><th>Note</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="apptBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Reschedule modal -->
  <div id="rescheduleModal" class="hidden" style="position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px">
    <div class="card" style="width:100%;max-width:420px">
      <h2>Reschedule appointment</h2>
      <p class="sub" id="rescheduleSummary"></p>
      <div class="field">
        <label for="newStart">New start time</label>
        <input id="newStart" type="datetime-local" />
      </div>
      <div class="alert info" style="font-size:0.82rem">Rescheduling sets the status back to Pending for re-confirmation.</div>
      <div class="mt-4 stack">
        <button class="btn" id="rescheduleConfirm">Save reschedule</button>
        <button class="btn ghost" id="rescheduleCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/staff-dashboard.js"></script>
</body>
</html>
