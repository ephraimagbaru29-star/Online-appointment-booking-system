<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Services</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/config.js"></script>
</head>
<body>
  <div id="topbar"></div>

  <main class="container">
    <h1 class="section-title mt-0">Services</h1>
    <div id="alert"></div>

    <div class="card">
      <h2 id="formTitle">Add a service</h2>
      <p class="sub">Define what customers can book. Set how long the appointment lasts.</p>
      <form id="serviceForm" class="form-grid">
        <input type="hidden" id="svcId" />
        <div class="field">
          <label for="svcName">Service name</label>
          <input id="svcName" type="text" maxlength="120" required placeholder="e.g. Haircut" />
        </div>

        <!-- Duration picker: Hours : Minutes : Seconds -->
        <div class="field">
          <label>Appointment duration</label>
          <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
            <div style="flex:1;min-width:80px">
              <div style="font-size:0.78rem;color:var(--muted);margin-bottom:4px;text-align:center">Hours</div>
              <select id="svcHours" style="text-align:center">
                <!-- 0–23 hours -->
              </select>
            </div>
            <div style="padding-bottom:10px;font-weight:700;color:var(--muted)">:</div>
            <div style="flex:1;min-width:80px">
              <div style="font-size:0.78rem;color:var(--muted);margin-bottom:4px;text-align:center">Minutes</div>
              <select id="svcMinutes" style="text-align:center">
                <!-- 0–59 minutes -->
              </select>
            </div>
            <div style="padding-bottom:10px;font-weight:700;color:var(--muted)">:</div>
            <div style="flex:1;min-width:80px">
              <div style="font-size:0.78rem;color:var(--muted);margin-bottom:4px;text-align:center">Seconds</div>
              <select id="svcSeconds" style="text-align:center">
                <!-- 0, 15, 30, 45 -->
              </select>
            </div>
          </div>
          <div id="durationPreview" class="hint" style="margin-top:8px"></div>
        </div>

        <div class="field">
          <label for="svcDescription">Description</label>
          <textarea id="svcDescription" rows="2" placeholder="Short description shown to customers"></textarea>
        </div>
        <div class="field">
          <label><input type="checkbox" id="svcActive" checked /> Active (available to book)</label>
        </div>
        <div class="between">
          <button class="btn" type="submit" id="saveBtn">Save service</button>
          <button class="btn ghost" type="button" id="resetBtn">Reset form</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All services</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Duration</th><th>Active</th><th>Actions</th></tr>
          </thead>
          <tbody id="svcBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="/js/services.js"></script>
</body>
</html>
